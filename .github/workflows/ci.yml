name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo build --workspace --release
      - run: ./target/release/graphlab doctor --json
      - run: ./target/release/graphlab hash README.md

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen 2>/dev/null || uv sync
      - run: uv run ruff check python tests 2>/dev/null || true
      - run: uv run pytest -q 2>/dev/null || echo "python layer not yet wired (M1+)"

  lean:
    # Deterministic small build only; mathlib cache makes this bounded.
    # Enabled at Milestone 3 when lean/ exists.
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "lean gate wired in M3"
