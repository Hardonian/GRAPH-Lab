name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo build --workspace --release
      - run: ./target/release/graphlab doctor --json
      - run: ./target/release/graphlab hash README.md
      - run: ./target/release/graphlab reproduce --campaign baseline
      - run: ./target/release/graphlab reproduce --campaign hadwiger-exhaustive
      - run: ./target/release/graphlab cert --input "IheA@GUAo" --name "Petersen"

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check python tests
      - run: uv run mypy python/graphlab
      - run: uv run pytest -q

  lean:
    # Lean 4 / Mathlib gate: the kernel re-checks every certificate in
    # lean/GraphLab/Facts.lean. Mathlib is pinned by lake-manifest.json;
    # the cache download is bounded and the build is small (~800 jobs).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install elan (Lean 4 toolchain)
        run: |
          curl -fsSL https://elan.lean-lang.org/install.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: pip install tomli
      - run: python3 scripts/lean_audit.py --run
